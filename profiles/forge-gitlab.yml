# GitLab, on gitlab.com or a self-managed instance.
#
# Without `forge`, every repo is GitHub on github.com. Repo names in
# `home_repo`, `repos` and the plan table become GitLab project paths,
# `group/project`, subgroups included.
forge: gitlab
host: gitlab.example.com       # leave unset for gitlab.com

ci:
  required: []                 # job names, not check names, when you list any
  dispatch: push               # values other than push and none are GitHub-only
  logs: gitlab-jobs            # the failed job's full trace; auto resolves to this

# release_branch: v2           # where milestones and the integration MR merge,
                               # when it is not the project's default branch

# offline:                     # a self-managed host behind a VPN is the usual
#   max_minutes: 90            # outage. Work under a landed claim carries on
                               # through it by default; set 90 only where a
                               # driver on another machine could take the plan
                               # over, or `offline: false` to wait instead

# integration_pr: false        # never open the change request from target_branch
                               # to the release branch at the end of the plan.
                               # Explicit milestone rows still open. The
                               # cumulative UAT script then goes to a
                               # `UAT: <project>` issue, or, with issues turned
                               # off, to a comment on the last merged change
                               # request, which nobody is asked to read
