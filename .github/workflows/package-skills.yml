name: Package skills

# Builds `phase-planner.zip` and `phase-driver.zip` so a packaging change can be
# checked before it ships, and runs `check-skills.sh` on every PR: a reference
# that climbs out of its skill directory works in this repo and is a dead link
# once the skill is installed from a zip, so the moment to catch it is the PR
# that adds it, not the release three weeks later.
#
# Attaching the zips to a release is NOT done here. It used to be, on
# `release: published`, which worked only while releases were published by hand.
# GitHub raises no workflow-triggering event for a release created with the
# repository's GITHUB_TOKEN, so the moment release.sh took over publishing, this
# workflow stopped running and v0.4.0 shipped with no assets and no error.
# release.sh attaches them in the same job that creates the release, which
# cannot fall out of step with itself.
#
# `workflow_dispatch` builds the zips from any branch and leaves them as a run
# artifact.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build skill zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs inside package-skills.sh too. Named here so a PR that breaks
      # self-containment says so in the check name rather than in a log.
      - name: Check skills are self-contained
        run: scripts/check-skills.sh

      - name: Build
        run: scripts/package-skills.sh

      # On a dispatch the zips land as a run artifact you can download from the
      # run summary. Release assets come from release.sh, not from here.
      - name: Upload as run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*.zip
