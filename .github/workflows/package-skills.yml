name: Package skills

# Builds `phase-planner.zip` and `phase-driver.zip` and attaches them to the
# release, so uploading the skills to a claude.ai account is a download and two
# file pickers rather than a clone and a shell.
#
# Publishing a release is what normally runs this. `workflow_dispatch` builds
# the same zips from any branch and leaves them as a run artifact instead,
# which is the way to check a packaging change before tagging.
#
# It also runs on every PR, for `check-skills.sh` rather than the zips: a
# reference that climbs out of its skill directory works in this repo and is a
# dead link once the skill is installed from a zip, so the moment to catch it
# is the PR that adds it, not the release three weeks later.

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build skill zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs inside package-skills.sh too. Named here so a PR that breaks
      # self-containment says so in the check name rather than in a log.
      - name: Check skills are self-contained
        run: scripts/check-skills.sh

      - name: Build
        run: scripts/package-skills.sh

      # No release to attach to on a dispatch, so the zips land as a run
      # artifact you can download from the run summary.
      - name: Upload as run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*.zip

  release:
    name: Attach zips to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    # The only step here that needs more than read, kept in its own job so PR
    # runs never hold a write token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: scripts/package-skills.sh

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber so re-running the job replaces the assets instead of
        # failing on names that already exist.
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
