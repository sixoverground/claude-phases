name: Release

# Two halves of one policy, which is why they share a file.
#
# On a PR: fail if the plugin changed and its version didn't. The marketplace
# serves plugin.json on the default branch, so an unbumped version means every
# existing install already believes it has the change and no update is ever
# offered. v0.2.0, v0.2.1 and v0.2.2 all shipped that way.
#
# Only on a PR into main, though. The version matters at the moment something
# reaches main, because main is what the marketplace serves, and at no other.
# A PR into a feature branch is one step of work that reaches main later in one
# piece, and the PR that carries it there is the one that bumps. Requiring a
# bump per step would mean a release per step, which is what a feature branch
# exists to avoid. The condition is on the job rather than a branch filter on
# the trigger so the check still appears on those PRs, as skipped, which says
# the omission is deliberate where an absent check would look like CI that
# stopped reporting.
#
# On merge: create the tag and release for whatever version plugin.json now
# declares. Deriving the tag from the manifest is what makes the two incapable
# of disagreeing, and it retires the hand-run `gh release create`.
#
# The release job attaches the skill zips itself. It cannot delegate that to
# package-skills.yml: GitHub starts no workflow from an event raised with the
# repository's GITHUB_TOKEN, so a release created here publishes without firing
# anything. v0.4.0 shipped with no assets for exactly that reason.
#
# `workflow_dispatch` re-runs the same job by hand, which is how a release that
# is missing its zips gets them without a version bump: release.sh finds the tag
# present and attaches the assets anyway.
#
# Three ways a release starts, then:
#
#   1. A push to main that changes plugin.json. The ordinary path.
#   2. A pull request merged into main (`pull_request_target`, `closed`). This
#      exists because GitHub skips a push-triggered workflow when the pushed
#      commit's message contains `[skip ci]`, `[ci skip]`, `[no ci]`,
#      `[skip actions]` or `[actions skip]`. A squash merge's message quotes the
#      messages of every commit it squashes, and plan commits end `[skip ci]`
#      by convention, so a milestone's squash merge can carry one. M2's did,
#      and 0.12.0 reached main with no tag and no release. The closing event is
#      not a push, so it does not read the squash message. It runs on every
#      merged PR, which is why it uses `release.sh --if-missing`: it creates a
#      release only where the version has none, and otherwise does nothing.
#   3. `workflow_dispatch`, the repair, as above.
#
# `scripts/check-release.sh` says whether the version on main has its tag, its
# release and its zips, and prints the repair when it does not.

on:
  pull_request:
  # Merged PRs only; the job's condition checks `merged`. See the header.
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
    # Only the manifest. Every other push to main is not a release, and a job
    # that starts only to discover it has nothing to do is noise in the log.
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-bumped:
    name: Version bumped
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the merge base, which a shallow clone
          # doesn't have.
          fetch-depth: 0

      - name: Check the version was bumped
        run: scripts/check-version-bump.sh "${{ github.event.pull_request.base.sha }}"

      # The skills state the version in their descriptions so Claude can say
      # which one is installed. This keeps those copies on plugin.json's.
      - name: Check skill descriptions name this version
        run: scripts/check-skill-versions.sh

  release:
    name: Tag and release
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    # One merge can start this job twice, from the push and from the merged PR.
    # Queued, never cancelled, so the second sees the first's release and stops.
    concurrency:
      group: release-main
      cancel-in-progress: false
    # The only job here that needs to write, kept narrow. PR runs never hold a
    # write token because they never reach this job.
    permissions:
      contents: write
    steps:
      # Pinned to main, not to the ref this ran on. A dispatch can name any
      # branch, and an unpinned checkout would read that branch's plugin.json,
      # build its zips, and hand them to `gh release create --target main` —
      # publishing a tag that points at main's code with a feature branch's
      # assets attached. The marketplace serves main, so main is what ships.
      #
      # It is also what makes `pull_request_target` safe here. That trigger runs
      # with a write token in this repository's context, and it is dangerous
      # only for a job that runs the pull request's code. This job checks out
      # main and nothing else. Keep it that way: never check out the pull
      # request's head or merge ref in this job, and never run a script from it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            scripts/release.sh --if-missing
          else
            scripts/release.sh
          fi
