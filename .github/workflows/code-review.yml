name: Code Review

# Reviews every PR and posts findings as inline comments on the diff.
#
# REQUIRES a CLAUDE_CODE_OAUTH_TOKEN repository secret. On Pro or Max, generate
# it locally with `claude setup-token` and paste it into
# Settings -> Secrets and variables -> Actions. Until that secret exists this
# workflow fails — which is the correct signal, not a bug: a configured
# reviewer that cannot authenticate should be visible, not silently skipped.
#
# For metered API billing instead, replace the auth line with:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# See docs/review-setup.md for federation and cloud-provider options.

on:
  pull_request:
    types: [opened, synchronize]

# `synchronize` is load-bearing: the merge gate needs proof the reviewer
# evaluated the CURRENT head commit. Without it, review goes stale the moment
# the driver pushes a fix, and the gate waits forever.

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    steps:
      # Required: the action restores trusted config (CLAUDE.md, .claude/, ...)
      # from origin/main before running, which needs a git repo present.
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # The review posts inline comments via `gh api`. Without this the
          # tool-permission layer denies those calls, the review completes
          # `success`, and nothing is posted — 14 denials on the first runs.
          claude_args: |
            --allowedTools "Bash(gh api:*),Bash(gh pr:*)"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
